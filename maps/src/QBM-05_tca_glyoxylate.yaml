id: QBM-05
title: TCA cycle and the Fe/S-dependent steps
subtitle: >-
  Drawn as an actual cycle, so a lesion at aconitase or succinate dehydrogenase
  throttles flux around the loop rather than stopping a line
derived_from: >-
  Figure 4 of Porterfield & Barker, "Plant Responses to Near-Null Magnetic Fields" —
  redrawn as a closed cycle, expanded to gene level and bound to Arabidopsis loci
species_anchor: arabidopsis_thaliana

caption: >-
  The review's Figure 4 renders this as a linear chain from glucose to oxaloacetate with
  no OAA-to-citrate closure, which the draft's own margin note flags. The closure
  matters: it is what shows that the two Fe/S-dependent steps throttle flux around the
  whole loop instead of interrupting a line. Aconitase and succinate dehydrogenase are
  the review's sentinel nodes and are annotated once on QBM-01, referenced here rather
  than re-declared, so one entity cannot carry different evidence on two maps. The
  citrate-to-isocitrate ratio is the most direct available in-vivo proxy for Fe/S
  cluster integrity and is worth measuring in any near-null-field metabolomics
  experiment. Note that plant mitochondrial fumarase is a class-II enzyme with no Fe/S
  cluster, unlike the class-I bacterial form it is sometimes confused with.

