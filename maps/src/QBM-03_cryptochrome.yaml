# QBM-03 — Cryptochrome radical-pair photochemistry
# Re-authoring of Figure 3 panel A. The one map where T1 is earned.

id: QBM-03
title: Cryptochrome radical-pair photochemistry
subtitle: >-
  The reference mechanism — and the failed replication that has to travel with it
derived_from: >-
  Figure 3 panel A of Porterfield & Barker, "Plant Responses to Near-Null Magnetic
  Fields" — expanded to the photocycle and bound to Arabidopsis loci
species_anchor: arabidopsis_thaliana

caption: >-
  Cryptochrome is the only plant entity in the review's bibliography where a magnetic
  field was applied and an effect measured on the protein's own chemistry rather than
  on a downstream phenotype, so it carries the atlas's only T1 annotations. The
  hyperfine partners that make this pair field-sensitive are the flavin's own nitrogens
  and protons — 14N at 99.6% natural abundance and 1H at essentially 100% — so unlike
  the 57Fe route argued for iron-sulfur clusters, this one is not abundance-limited.
  That asymmetry is much of why cryptochrome is the strongest case here and the Fe/S
  nodes elsewhere are not. Phytochrome B is drawn deliberately as context with no
  quantum claim: its photochemistry is a Z/E isomerisation offering no spin-based
  route, so reported field effects on phytochrome signalling are most simply a
  downstream consequence of cryptochrome. Note also that one blinded replication
  (Harris et al. 2009) did NOT reproduce cryptochrome-dependent field effects; that
  result is recorded in the ontology on the same footing as the positive reports.

