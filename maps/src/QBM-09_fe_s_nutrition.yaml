id: QBM-09
title: Iron uptake and sulfate assimilation
subtitle: >-
  Where the Arabidopsis near-null-field evidence is strongest — and where the review
  draws no figure
derived_from: >-
  Motivated by section 6 and the Islam 2020 / Vigani 2021 / Narayana 2018 evidence in
  Porterfield & Barker, "Plant Responses to Near-Null Magnetic Fields" — no
  corresponding figure exists in the manuscript
species_anchor: arabidopsis_thaliana

caption: >-
  One of two maps the review motivates but does not draw. That is an odd gap, because
  mineral nutrition is where the direct Arabidopsis near-null-field evidence is
  strongest: three separate studies report effects on root mineral nutrition, iron
  uptake efficiency and Fe-S interplay. The map makes the loop visible. Sulfate
  assimilation supplies the sulfide that every cluster on QBM-04 is built from, and
  sulfite reductase is itself a ferredoxin-dependent siroheme-[4Fe-4S] enzyme drawing
  on plastid reducing power from QBM-02 — so iron and sulfur status are not two inputs
  but one feedback system, which is exactly why Vigani et al. found the effect most
  pronounced under combined Fe and S deficiency. Note the tier pattern: uptake and
  assimilation are T2 on real evidence, but they are classed as structural context
  because no quantum route is proposed for them. A demonstrated effect with no
  mechanism is recorded here as precisely that.

