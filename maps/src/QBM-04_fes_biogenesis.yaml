    compartment: cytosol
    node_width: 190
    nodes: [FE_SUPPLY]

  - id: isc
    compartment: mitochondrial_matrix
    node_width: 175
    nodes: [NFS1, ISU1, FRATAXIN, HSCB_GRXS15, NFU_CARRIERS]

  - id: export
    compartment: mitochondrial_inner_membrane
    node_width: 200
    nodes: [ATM3_EXPORT]

  - id: plastid_cytosol
    compartment: chloroplast_stroma
    node_width: 195
    nodes: [SUF_SYSTEM, CNFU_HCF101, CIA_SYSTEM]

  - id: clients
    compartment: cell
    node_width: 260
    nodes: [FES_CLIENTS]

