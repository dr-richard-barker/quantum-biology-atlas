# QBM-04 — Iron-sulfur cluster biogenesis: ISC, SUF and CIA
# Re-authoring of Figure 3 panel B, expanded to the three assembly systems.

id: QBM-04
title: Iron-sulfur cluster biogenesis — ISC, SUF and CIA
subtitle: >-
  The upstream dependency of every Fe/S node in the atlas, and where the review's
  mechanism is most attractive and least tested
derived_from: >-
  Figure 3 panel B of Porterfield & Barker, "Plant Responses to Near-Null Magnetic
  Fields" — expanded to the three assembly systems and bound to Arabidopsis loci
species_anchor: arabidopsis_thaliana

caption: >-
  Every Fe/S node on QBM-01, QBM-02 and QBM-05 depends on one of these three systems,
  so a defect here sits upstream of the whole atlas and would appear as a metabolic
  lesion well before any visible phenotype. Read the tiers carefully, because they mark
  a distinction that is easy to blur: the near-null-field evidence in this area
  (Islam 2020, Vigani 2021, Narayana 2018) measured iron UPTAKE and Fe-S interplay —
  nutritional physiology — and is attached to the Fe/S supply node, which is therefore
  T2. No experiment in the bibliography applied a magnetic field and measured cluster
  assembly itself, so every assembly node remains T3 no matter how attractive the
  mechanism looks. The single arrow from mitochondrial export to the CIA system is the
  reason this map reaches beyond bioenergetics: CIA clients include the DNA replication
  and repair enzymes, so a mitochondrial lesion propagates to genome maintenance.

