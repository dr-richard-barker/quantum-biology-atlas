id: QBM-07
title: ROS production, scavenging and redox buffering
subtitle: >-
  The amplifier that makes the review's hypothesis testable — and the reason it
  cannot identify a mechanism on its own
derived_from: >-
  Figure 3 panel C and Figure 5 of Porterfield & Barker, "Plant Responses to Near-Null
  Magnetic Fields" — expanded to the scavenging network and bound to Arabidopsis loci
species_anchor: arabidopsis_thaliana

caption: >-
  A weak-field effect on an electron-transfer branching ratio may be far too small to
  measure as a rate change, but ROS signalling is threshold-like, so the same small
  change can register as a transcriptional response. That is why the ROS-responsive
  programme is the best-evidenced node in the whole atlas, and equally why it cannot
  identify a mechanism: an amplifier reports that something moved upstream, never what.
  The map deliberately includes enzymes with no spin route at all — the
  peroxiredoxin/thioredoxin system is pure two-electron thiol chemistry with no radical
  intermediate and no metal — so that "redox" is not read as a synonym for
  "magnetically addressable". The heme peroxidases do cycle through a genuine porphyrin
  radical, but it is exchange-coupled to the ferryl iron and extremely short-lived, and
  that caveat travels with the annotation.

