    node_width: 200
    nodes: [PSI_FES, THYLAKOID_ATP_SYNTHASE]

  - id: stroma
    compartment: chloroplast_stroma
    node_width: 190
    nodes: [FERREDOXIN, FNR, NADPH_POOL, PLASTID_ROS]

