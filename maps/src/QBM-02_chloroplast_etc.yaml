    compartment: thylakoid_lumen
    node_width: 150
    nodes: [H2O, PLASTOCYANIN]

  - id: photosystem_ii
    compartment: thylakoid_membrane
    node_width: 200
    nodes: [PSII, PLASTOQUINONE_POOL, PLASTOSEMIQUINONE]

  - id: cytochrome_b6f
    compartment: thylakoid_membrane
    node_width: 200
    nodes: [CYTB6F_RIESKE, CYT_B6, PGR5_PGRL1]

  - id: photosystem_i
