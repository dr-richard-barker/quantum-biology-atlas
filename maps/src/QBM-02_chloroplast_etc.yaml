# QBM-02 — Photosynthetic electron transport and plastid redox
# Re-authoring of Figures 1B / 5 of the review. No coordinates: geometry is derived.

id: QBM-02
title: Photosynthetic electron transport and plastid redox
subtitle: >-
  Magnetically addressable nodes of the chloroplast, from water oxidation to NADPH,
  with the evidence tier for each shown as a border style
derived_from: >-
  Figures 1B and 5 of Porterfield & Barker, "Plant Responses to Near-Null Magnetic
  Fields" — expanded to gene level and bound to Arabidopsis loci
species_anchor: arabidopsis_thaliana

caption: >-
  The photosynthetic chain redrawn with each node's quantum chemistry and the evidence
  behind it. Photosystem I is the strongest structural case in the atlas: charge
  separation at P700 makes a genuine spin-correlated radical pair, the species the
  radical-pair mechanism was written for. It is nevertheless only T2, because the one
  direct field measurement on photosynthesis in the review's bibliography was made in
  lima bean rather than Arabidopsis, and because that pair is extremely short-lived
  and its known field effects are seen well above geomagnetic strength. Cyclic electron
  flow is drawn for the same reason alternative oxidase appears on QBM-01 — it lets a
  chloroplast rebalance ATP against NADPH without changing linear flux, so measuring
  linear electron transport alone cannot separate "no effect" from "compensated
  effect". Four nodes are plastid-encoded (ATCG loci) and will receive no value from
  poly-A-selected RNA-seq, which is most of OSDR's plant studies.

