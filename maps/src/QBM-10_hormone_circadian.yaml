id: QBM-10
title: Hormone and circadian integration of the flowering response
subtitle: >-
  How a photoreceptor effect becomes a phenotype — and why timing may explain the
  inconsistency in the literature
derived_from: >-
  Motivated by section 8 and the Xu 2012/2017/2018/2021 and Agliassa 2018 evidence in
  Porterfield & Barker, "Plant Responses to Near-Null Magnetic Fields" — no
  corresponding figure exists in the manuscript
species_anchor: arabidopsis_thaliana

caption: >-
  The second map the review motivates but does not draw, covering the other area where
  direct Arabidopsis evidence is strongest. Delayed flowering is the most reproducible
  near-null-field phenotype in the whole literature, and separate studies have
  implicated cryptochrome, gibberellin and auxin in producing it. Drawn together, the
  route from a photoreceptor to a phenotype becomes concrete and testable with existing
  mutants — which is what the review's call for cry1 cry2, phytochrome and hormone
  genetics amounts to. The clock is the map's most speculative element and is marked
  T3: no field measurement on clock components exists in the bibliography. It is drawn
  because a clock is a gate, so the same perturbation applied at different times can
  produce opposite outcomes — which could explain some of the inconsistency across
  near-null-field studies, and is testable rather than merely plausible. That is offered
  as an experimental design consideration, not a finding.

