id: QBM-08
title: From magnetic environment to plant phenotype
subtitle: >-
  The review's integrated model — an architecture for designing experiments, not a
  demonstrated causal network
derived_from: >-
  Figure 7 of Porterfield & Barker, "Plant Responses to Near-Null Magnetic Fields" —
  expanded and tier-annotated
species_anchor: arabidopsis_thaliana

caption: >-
  The flagship map, and the one that has to be read most carefully. The review states
  that its Figure 7 is designed for hypothesis generation and experimental planning
  rather than as a proven causal network, and the tiers here preserve that distinction:
  the input perturbation and the developmental outputs carry real evidence, while the
  molecular route between them does not. Read the border styles from left to right and
  the shape of the field's problem is visible — the evidence is concentrated at the two
  ends, on the perturbation and on the phenotypes, while the middle, where the
  mechanism would have to live, is almost entirely dashed. Primary metabolism, the
  review's central thesis, is drawn as T4 on purpose: the metabolic route is argued
  rather than demonstrated, and the map should not let it borrow credibility from the
  developmental evidence beside it. The model is explicitly modular — cryptochrome may
  dominate in blue-light-grown seedlings, mitochondria in dark-imbibed seeds, plastids
  in greening tissue, and nutrient uptake in roots — so a single phenotype may be
  produced by different weightings of the same components depending on tissue, stage
  and light regime.

