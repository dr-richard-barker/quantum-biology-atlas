id: QBM-06
title: Seed germination before photosynthesis
subtitle: >-
  The review's highest-leverage window — and the experiment nobody has run
derived_from: >-
  Figure 6 of Porterfield & Barker, "Plant Responses to Near-Null Magnetic Fields" —
  expanded to the reserve-mobilisation route and bound to Arabidopsis loci
species_anchor: arabidopsis_thaliana

caption: >-
  Before chloroplasts mature, an oilseed embryo is entirely heterotrophic: stored
  triacylglycerol must be mobilised, run through peroxisomal beta-oxidation and the
  glyoxylate cycle, and converted to ATP by mitochondrial respiration. That makes the
  first 0-72 hours after imbibition the window where a respiratory or Fe/S lesion would
  have most leverage, and the reason Arabidopsis and Brassica are comparable systems
  for the review's argument. The original Figure 6 carried a summary table of
  "normalized trend ranges" for germination rate, radicle length, ATP status and
  seedling vigour; those were qualitative cross-study impressions rather than measured
  values, so no number from them is reproduced here. The map shows the route and the
  endpoints; any quantity has to arrive from projected data. Every node on this map is
  T3 or T4, which is the honest state of the field: the review's central proposal is a
  geomagnetic-versus-near-null imbibition time course, and no such experiment exists in
  its bibliography.

