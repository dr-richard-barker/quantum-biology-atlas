<svg xmlns="http://www.w3.org/2000/svg" data-theme="light" viewBox="0 0 960.0 700.0" width="960.0" height="700.0">
<style>

      .title { font: bold 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #16181d; }
      .subtitle { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #55606e; }
      .provenance { font: italic 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #55606e; }
      .box { fill: #f7f8fa; stroke: #16181d; stroke-width: 1.5; rx: 8px; }
      .box-chem { fill: #ffffff; stroke: #3d3d3d; stroke-width: 1.2; rx: 6px; }
      .box-transcript { fill: #f0f6fa; stroke: #0072B2; stroke-width: 2.0; rx: 6px; }
      .box-metabolite { fill: #fdf5f0; stroke: #D55E00; stroke-width: 2.2; rx: 8px; }
      .label-node { font: bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #16181d; text-anchor: middle; }
      .label-sub { font: 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #55606e; text-anchor: middle; }
      .label-stat-down { font: bold 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0072B2; text-anchor: middle; }
      .label-stat-up { font: bold 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #D55E00; text-anchor: middle; }
      .arrow { stroke: #55606e; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #55606e; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrowhead); }
      .band-label { font: bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #55606e; text-transform: uppercase; letter-spacing: 0.05em; }
    
</style>
<defs>
<marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#55606e"/>
</marker>
</defs>
<rect width="960.0" height="700.0" fill="#ffffff"/>
<text class="title" x="24" y="36">Phenylpropanoid &amp; Volatilome Pathway: The Gene-Metabolite Decoupling</text>
<text class="subtitle" x="24" y="58">Ocimum basilicum under hypomagnetic field (hMF &lt; 40 nT vs GMF ~44.4 µT) · 4-week exposure</text>
<text class="provenance" x="24" y="76">Source: Mannino, Caldo &amp; Maffei (2026), Journal of Plant Physiology 326:154872 · doi:10.1016/j.jplph.2026.154872</text>
<line x1="24" y1="88" x2="936.0" y2="88" stroke="#e5e9f0" stroke-width="1"/>
<rect x="24" y="100" width="440" height="450" fill="#fafbfc" stroke="#e5e9f0" rx="10"/>
<text class="band-label" x="38" y="122">Core Phenylpropanoid → Eugenol &amp; Methyl Eugenol</text>
<rect x="480" y="100" width="456" height="280" fill="#fafbfc" stroke="#e5e9f0" rx="10"/>
<text class="band-label" x="494" y="122">Flavonoid Biosynthesis &amp; Glycoside Remodelling</text>
<rect x="480" y="396" width="456" height="154" fill="#fafbfc" stroke="#e5e9f0" rx="10"/>
<text class="band-label" x="494" y="418">Monoterpenes &amp; Sesquiterpenes (Volatilome)</text>
<g class="node-chem">
<rect class="box-chem" x="80.0" y="137.0" width="140" height="36"/>
<text class="label-node" x="150" y="155">L-Phenylalanine</text>
<text class="label-sub" x="150" y="168">Shikimate precursor</text>
</g>
<path d="M 150 173 L 150 197" class="arrow"/>
<g class="node-transcript">
<rect class="box-transcript" x="65.0" y="197.0" width="170" height="50"/>
<text class="label-node" x="150" y="214">PAL (ObPAL)</text>
<text class="label-sub" x="150" y="227">AT2G37040</text>
<text class="label-stat-down" x="150" y="241">log2FC -1.05 ± 0.15*</text>
</g>
<path d="M 150 247 L 150 270" class="arrow"/>
<g class="node-chem">
<rect class="box-chem" x="80.0" y="270.0" width="140" height="36"/>
<text class="label-node" x="150" y="288">trans-Cinnamate</text>
<text class="label-sub" x="150" y="301">→ Caffeic acid</text>
</g>
<path d="M 150 306 L 150 328" class="arrow"/>
<g class="node-transcript">
<rect class="box-transcript" x="65.0" y="328.0" width="170" height="50"/>
<text class="label-node" x="150" y="345">COMT (ObCOMT)</text>
<text class="label-sub" x="150" y="358">AT5G54160</text>
<text class="label-stat-down" x="150" y="372">log2FC -1.30 ± 0.20*</text>
</g>
<path d="M 150 378 L 150 400" class="arrow"/>
<g class="node-transcript">
<rect class="box-transcript" x="65.0" y="400.0" width="170" height="50"/>
<text class="label-node" x="150" y="417">4CL (Ob4CL)</text>
<text class="label-sub" x="150" y="430">AT1G51680</text>
<text class="label-stat-down" x="150" y="444">log2FC -0.70 ± 0.10*</text>
</g>
<path d="M 150 450 L 150 472" class="arrow"/>
<g class="node-chem">
<rect class="box-chem" x="80.0" y="472.0" width="140" height="36"/>
<text class="label-node" x="150" y="490">Coniferyl acetate</text>
<text class="label-sub" x="150" y="503">CCR / CAD / CFAT</text>
</g>
<path d="M 220 490 L 260 490" class="arrow"/>
<g class="node-transcript">
<rect class="box-transcript" x="265.0" y="465.0" width="160" height="50"/>
<text class="label-node" x="345" y="482">EGS (ObEGS)</text>
<text class="label-sub" x="345" y="495">AT1G72680</text>
<text class="label-stat-down" x="345" y="509">log2FC -0.80 ± 0.12*</text>
</g>
<path d="M 345 465 L 345 390" class="arrow"/>
<g class="node-metabolite">
<rect class="box-metabolite" x="262.5" y="328.0" width="165" height="54"/>
<text class="label-node" x="345" y="346" style="fill:#D55E00">EUGENOL</text>
<text class="label-stat-up" x="345" y="360">+28% (+1.28x)*</text>
<text class="label-sub" x="345" y="373">3.08 ± 0.15 mg/g d.w.</text>
</g>
<path d="M 345 328 L 345 272" class="arrow"/>
<g class="node-transcript">
<rect class="box-transcript" x="265.0" y="220.0" width="160" height="50"/>
<text class="label-node" x="345" y="237">EOMT (ObEOMT)</text>
<text class="label-sub" x="345" y="250">AT1G21100</text>
<text class="label-stat-down" x="345" y="264">log2FC -1.65 ± 0.15*</text>
</g>
<path d="M 345 220 L 345 178" class="arrow"/>
<g class="node-metabolite">
<rect class="box-metabolite" x="262.5" y="123.0" width="165" height="54"/>
<text class="label-node" x="345" y="141" style="fill:#D55E00">METHYL EUGENOL</text>
<text class="label-stat-up" x="345" y="155">+79% (+1.79x)*</text>
<text class="label-sub" x="345" y="168">0.34 ± 0.05 mg/g d.w.</text>
</g>
<path d="M 235 425 Q 480 425 560 270" class="arrow-dashed"/>
<g class="node-transcript">
<rect class="box-transcript" x="500.0" y="150.0" width="160" height="50"/>
<text class="label-node" x="580" y="167">CHS (ObCHS)</text>
<text class="label-sub" x="580" y="180">AT5G13930</text>
<text class="label-stat-down" x="580" y="194">log2FC -1.45 ± 0.18*</text>
</g>
<path d="M 660 175 L 720 175" class="arrow"/>
<g class="node-transcript">
<rect class="box-transcript" x="720" y="150" width="180" height="50"/>
<text class="label-node" x="810" y="166">CHI / CHIL (ObCHI/CHIL)</text>
<text class="label-sub" x="810" y="179">AT3G55120 / AT5G05270</text>
<text class="label-stat-down" x="810" y="193">log2FC -0.95* / -1.35*</text>
</g>
<path d="M 580 200 L 580 235" class="arrow"/>
<path d="M 810 200 L 810 235" class="arrow"/>
<g class="node-metabolite">
<rect class="box-metabolite" x="495.0" y="235.0" width="170" height="50"/>
<text class="label-node" x="580" y="251" style="fill:#D55E00">TOTAL FLAVONOIDS</text>
<text class="label-stat-up" x="580" y="265">+18% (+1.18x)*</text>
<text class="label-sub" x="580" y="278">130 vs 110 mg QE/g</text>
</g>
<g>
<rect x="680" y="235" width="236" height="125" fill="#ffffff" stroke="#e5e9f0" rx="6"/>
<text class="label-node" x="798" y="254" style="fill:#16181d">LC-MS/MS Remodelling</text>
<text class="label-sub" x="798" y="270" style="fill:#D55E00;font-weight:600">▲ Glucuronides &amp; Rhamnosides</text>
<text class="label-sub" x="798" y="284">Cluster 1 (apigenin-, catechin-O-rham)</text>
<text class="label-sub" x="798" y="302" style="fill:#0072B2;font-weight:600">▼ Dihydroflavonols &amp; Aglycones</text>
<text class="label-sub" x="798" y="316">Cluster 2 (dihydroquercetin, catechin)</text>
<text class="label-sub" x="798" y="340" style="font-style:italic">Polar conjugates enhance vacuolar ROS buffer</text>
</g>
<g class="node-metabolite">
<rect class="box-metabolite" x="495.0" y="438.0" width="170" height="54"/>
<text class="label-node" x="580" y="456" style="fill:#D55E00">cis-OCIMENE</text>
<text class="label-stat-up" x="580" y="470">+119% (+2.19x)*</text>
<text class="label-sub" x="580" y="483">0.09 ± 0.01 mg/g d.w.</text>
</g>
<g class="node-metabolite">
<rect class="box-metabolite" x="695.0" y="438.0" width="170" height="54"/>
<text class="label-node" x="780" y="456" style="fill:#D55E00">1,8-CINEOLE</text>
<text class="label-stat-up" x="780" y="470">+35% (+1.35x)*</text>
<text class="label-sub" x="780" y="483">0.57 ± 0.02 mg/g d.w.</text>
</g>
<g class="node-metabolite">
<rect class="box-metabolite" x="540.0" y="505.0" width="280" height="38"/>
<text class="label-node" x="680" y="515" style="fill:#D55E00">TOTAL IDENTIFIED ESSENTIAL OIL</text>
<text class="label-stat-up" x="680" y="529">+29% (+1.29x)*</text>
<text class="label-sub" x="680" y="542">5.75 ± 0.53 vs 4.44 ± 0.38 mg/g d.w.</text>
</g>
<rect x="24" y="565" width="912.0" height="115" fill="#f4f6fa" stroke="#e5e9f0" rx="8"/>
<text class="label-node" x="40" y="588" style="text-anchor:start;fill:#16181d;font-size:13px">THE GENE-METABOLITE DECOUPLING PARADOX UNDER NEAR-NULL MAGNETIC FIELDS</text>
<text class="label-sub" x="40" y="606" style="text-anchor:start;font-size:10px;fill:#16181d">• Transcriptional Repression (Blue): Every analysed phenylpropanoid &amp; early flavonoid transcript (ObPAL, ObCOMT, ObEGS, ObEOMT, Ob4CL, ObCHS, ObCHI, ObCHIL)</text>
<text class="label-sub" x="40" y="619" style="text-anchor:start;font-size:10px;fill:#16181d">  is significantly downregulated under hMF (&lt; 40 nT) compared with GMF controls (log2 fold change from -0.70 to -1.65, P &lt; 0.05).</text>
<text class="label-sub" x="40" y="632" style="text-anchor:start;font-size:10px;fill:#16181d">• Physical Accumulation (Vermillion): In sharp contrast, volatile essential oils (eugenol +28%, methyl eugenol +79%, cis-ocimene +119%, total volatiles +26%)</text>
<text class="label-sub" x="40" y="645" style="text-anchor:start;font-size:10px;fill:#16181d">  and total flavonoids (+18%) increase significantly, accompanied by a shift toward more polar glucuronide and rhamnoside conjugates.</text>
<text class="label-sub" x="40" y="658" style="text-anchor:start;font-size:10px;fill:#16181d">• Biological Significance: Demonstrates that near-null magnetic field adaptation in aromatic crops involves post-transcriptional control, metabolic flux redirection,</text>
<text class="label-sub" x="40" y="671" style="text-anchor:start;font-size:10px;fill:#16181d">  and altered precursor allocation (shikimate pathway) rather than steady-state transcript abundance, critical for space agriculture (BLSS) optimization.</text>
</svg>